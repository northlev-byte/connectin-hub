<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectIn Events — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --lime: #5bd639;
    --lime-dim: #4ab82e;
    --bg: #141617;
    --card: #212326;
    --border: #2e3135;
    --text: #ffffff;
    --muted: #8b909a;
    --mono: 'DM Mono', monospace;
    --head: 'Syne', sans-serif;
    --body: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(198,241,53,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(198,241,53,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .box {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    margin: 24px;
    animation: fadeUp 0.5s ease both;
  }

  .box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--lime);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--lime);
    opacity: 0.8;
    margin-bottom: 10px;
  }

  h1 {
    font-family: var(--head);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  h1 span { color: var(--lime); }

  .sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 36px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 20px;
  }

  input[type="password"]:focus {
    border-color: rgba(198,241,53,0.4);
  }

  button {
    width: 100%;
    background: var(--lime);
    color: #0e0f0c;
    border: none;
    font-family: var(--head);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover:not(:disabled) { background: var(--lime-dim); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  @media (hover: none) {
    button:active:not(:disabled) { opacity: 0.8; transform: scale(0.99); }
  }

  .error {
    font-family: var(--mono);
    font-size: 11px;
    color: #e05c5c;
    letter-spacing: 0.1em;
    margin-top: 14px;
    display: none;
    line-height: 1.5;
  }

  .error.show { display: block; }
</style>
</head>
<body>
<div class="box">
  <img src="/logo.png" alt="ConnectIn Events" style="height:36px; width:auto; max-width:200px; display:block; margin-bottom:20px; object-fit:contain;">
  <h1>Tools <span>Hub</span></h1>
  <p class="sub">Internal access only — enter your password to continue.</p>

  <form id="form" onsubmit="checkPassword(event)">
    <label for="pw">Password</label>
    <input type="password" id="pw" placeholder="••••••••••••" autofocus autocomplete="current-password">
    <button type="submit">Enter Hub →</button>
    <p class="error" id="error">Incorrect password. Try again.</p>
  </form>
</div>

<script>
  // Session validity check (7-day expiry)
  (function() {
    const auth = localStorage.getItem('ci_auth') === '1';
    if (!auth) return;
    if (!localStorage.getItem('ci_auth_exp')) {
      // Migrate existing session: grant 7 days from now
      localStorage.setItem('ci_auth_exp', (Date.now() + 7 * 24 * 60 * 60 * 1000).toString());
    }
    const exp = parseInt(localStorage.getItem('ci_auth_exp'), 10);
    if (Date.now() > exp) {
      localStorage.removeItem('ci_auth');
      localStorage.removeItem('ci_auth_exp');
      return;
    }
    window.location.replace('/profile');
  })();

  async function checkPassword(e) {
    e.preventDefault();
    const pw    = document.getElementById('pw').value.trim();
    const btn   = document.querySelector('button[type="submit"]');
    const errEl = document.getElementById('error');

    btn.disabled    = true;
    btn.textContent = 'Verifying…';
    errEl.classList.remove('show');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });

      if (res.ok) {
        btn.textContent = 'Verified ✓';
        const exp = Date.now() + 7 * 24 * 60 * 60 * 1000;
        localStorage.setItem('ci_auth', '1');
        localStorage.setItem('ci_auth_exp', exp.toString());
        window.location.replace('/profile');
        return;
      }

      if (res.status === 429) {
        errEl.textContent = 'Too many attempts — please wait 15 minutes and try again.';
      } else {
        errEl.textContent = 'Incorrect password. Try again.';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    } catch {
      errEl.textContent = 'Connection error — check your internet and try again.';
    }

    errEl.classList.add('show');
    btn.disabled    = false;
    btn.textContent = 'Enter Hub →';
  }
</script>
</body>
</html>
