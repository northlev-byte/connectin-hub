<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectIn Events — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --lime: #c6f135;
    --lime-dim: #9fbe2a;
    --bg: #0e0f0c;
    --card: #1a1c14;
    --border: #2a2e1e;
    --text: #e8ecda;
    --muted: #6b7155;
    --mono: 'DM Mono', monospace;
    --head: 'Syne', sans-serif;
    --body: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(198,241,53,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(198,241,53,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .box {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    margin: 24px;
    animation: fadeUp 0.5s ease both;
  }

  .box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--lime);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--lime);
    opacity: 0.8;
    margin-bottom: 10px;
  }

  h1 {
    font-family: var(--head);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  h1 span { color: var(--lime); }

  .sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 36px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 20px;
  }

  input[type="password"]:focus {
    border-color: rgba(198,241,53,0.4);
  }

  button {
    width: 100%;
    background: var(--lime);
    color: #0e0f0c;
    border: none;
    font-family: var(--head);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: var(--lime-dim); }

  .error {
    font-family: var(--mono);
    font-size: 11px;
    color: #e05c5c;
    letter-spacing: 0.1em;
    margin-top: 14px;
    display: none;
  }

  .error.show { display: block; }
</style>
</head>
<body>
<div class="box">
  <img src="https://connectinevents.co.uk/wp-content/uploads/2025/04/connectin-logo-green-white.png" alt="ConnectIn Events" style="height:36px; width:auto; display:block; margin-bottom:20px;">
  <h1>Tools <span>Hub</span></h1>
  <p class="sub">Internal access only — enter your password to continue.</p>

  <form id="form" onsubmit="checkPassword(event)">
    <label for="pw">Password</label>
    <input type="password" id="pw" placeholder="••••••••••••" autofocus autocomplete="current-password">
    <button type="submit">Enter Hub →</button>
    <p class="error" id="error">Incorrect password. Try again.</p>
  </form>
</div>

<script>
  async function checkPassword(e) {
    e.preventDefault();
    const pw = document.getElementById('pw').value;

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });

    if (res.ok) {
      window.location.replace('/');
    } else {
      document.getElementById('error').classList.add('show');
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }
</script>
</body>
</html>
